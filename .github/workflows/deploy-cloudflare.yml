# Deploy unified CareYu PMS (React SPA + Express API) to Cloudflare Workers.
#
# Required GitHub Actions secrets (repository settings, not committed):
#   CLOUDFLARE_API_TOKEN   — Account → Workers Scripts → Edit
#                            https://dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID  — optional; wrangler.jsonc already has account_id
#                            (ecea99dafa2e59907d7ee4d33150bfe4)
#
# Add secrets at:
#   https://github.com/fsdengg1/care-yu-pms/settings/secrets/actions
#
# Cloudflare dashboard will still list these as "Manually deployed" / Wrangler
# because GitHub Actions uses the Wrangler CLI (not Workers Git integration).

name: Deploy CareYu PMS (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-careyu-pms
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and backend
        run: npm run build:prod

      - name: Verify Worker assets exist
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          test -f backend/wrangler.jsonc

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            echo "Add it at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo "Create a token with Account → Workers Scripts → Edit:"
            echo "https://dash.cloudflare.com/profile/api-tokens"
            echo "Account ID (if you also add CLOUDFLARE_ACCOUNT_ID): ecea99dafa2e59907d7ee4d33150bfe4"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is present (value not printed)."

      - name: Deploy Worker careyu-backend-api
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
