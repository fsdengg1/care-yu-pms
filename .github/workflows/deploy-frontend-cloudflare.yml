# Auto-deploy frontend to Cloudflare Pages when main branch changes.
# Requires GitHub repo secret: CLOUDFLARE_API_TOKEN
# Account ID is public (not a secret).
#
# If you also connect Cloudflare Dashboard → GitHub native builds,
# disable this workflow to avoid duplicate deployments.

name: Deploy Frontend (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for Cloudflare Pages
        run: npm run build -w frontend
        env:
          # Production: client auto-uses Worker API on *.pages.dev domains
          NEXT_PUBLIC_API_URL: ''
          CLOUDFLARE_API_ORIGIN: https://careyu-backend-api.aicareyuautomation.workers.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ecea99dafa2e59907d7ee4d33150bfe4
          workingDirectory: frontend
          command: pages deploy .cloudflare-out --project-name=careyu-frontend --commit-dirty=true
